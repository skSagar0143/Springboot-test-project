apiVersion: apps/v1
kind: Deployment
metadata:
  name: springboot-test-project
  labels:
    app: springboot-test-project
spec:
  replicas: 2
  selector:
    matchLabels:
      app: springboot-test-project
  template:
    metadata:
      labels:
        app: springboot-test-project
    spec:
      containers:
        - name: springboot-test-project
          # Replace YOUR_DOCKERHUB_USERNAME with your Docker Hub username.
          image: YOUR_DOCKERHUB_USERNAME/springboot-test-project:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi